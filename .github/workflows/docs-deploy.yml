name: Deploy docs site

# Publishes apps/docs to this repository's GitHub Pages site,
# https://zz-plant.github.io/refract/. SITE_URL in apps/docs/site.mjs must
# match it: canonical links, the sitemap and Open Graph URLs are built from it.
# The site's earlier addresses under refract-org.github.io no longer serve.
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
      # The site's logo is the brand mark itself.
      - assets/brand/**
      # The site builds the viewer into viewer/ (apps/docs/viewer.mjs). Its
      # event types are erased at build time, so evidence-graph is not listed.
      - apps/ui/**
      - package.json
      - bun.lock
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
