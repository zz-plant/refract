name: Release
on:
  push:
    tags:
      - "v*"
  # publish.yml calls this for a tag it pushed itself, since a tag pushed with
  # the workflow token does not start the push trigger above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to create the GitHub release for, such as v0.6.1
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      # A re-run finds the release it made the first time. --verify-tag stops gh
      # from creating a missing tag at the default branch's head.
      - run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The $TAG release already exists"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
