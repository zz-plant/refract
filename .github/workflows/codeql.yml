name: CodeQL Analysis
# Pull requests and the weekly scan. The push to main after a merge analysed
# the tree its pull request had just analysed; the Monday run keeps main's
# baseline for code scanning current.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
