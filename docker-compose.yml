# One-shot analysis from a local build. The image's entry point is the CLI, so
# `command` holds CLI arguments only. `refract explore` is not offered here: its
# server listens on the container's loopback address by design, which a
# published port cannot reach.
services:
  refract:
    build: .
    command: ["analyze", "Earth", "--depth", "brief", "--json"]
